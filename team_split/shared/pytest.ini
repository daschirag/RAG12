[pytest]
testpaths = tests
# team_split/ holds per-student COPIES of tests; never collect them
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv node_modules team_split
pythonpath = .
addopts = -ra
markers =
    integration: uses real local models (sentence-transformers / ChromaDB) on temp data
    ollama: needs a running Ollama server (ollama serve); skipped when unreachable
